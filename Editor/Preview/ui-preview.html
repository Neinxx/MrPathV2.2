<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>CompositeCurveView 预览占位页</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { color-scheme: dark; }
    body{ margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; background:#181818; color:#ddd; }
    header{ padding:16px; border-bottom:1px solid #333; }
    main{ padding:16px; max-width:960px; margin:0 auto; }
    .panel{ height:220px; border:1px solid #333; background:linear-gradient(#202020,#1a1a1a); border-radius:8px; position:relative; margin-bottom:14px; }
    .grid{ position:absolute; inset:0; background-image:
      linear-gradient(to right, rgba(255,255,255,.06) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,.06) 1px, transparent 1px);
      background-size:10% 100%, 100% 16.6%; }
    .title{ position:absolute; top:8px; left:10px; font-weight:600; font-size:14px; color:#bbb; }
    .hint{ font-size:14px; color:#aaa; line-height:1.6; }
    .badge{ display:inline-block; padding:3px 8px; background:#333; border:1px solid #444; border-radius:6px; margin-right:8px; }
  </style>
</head>
<body>
  <header>
    <div class="badge">上下布局</div>
    <div class="badge">Falloff 按原始权重 0..1</div>
    <div class="badge">不绘制接缝链接</div>
  </header>
  <main>
    <div class="panel">
      <div class="grid"></div>
      <div class="title">CrossSection（顶部面板）</div>
    </div>
    <div class="panel">
      <div class="grid"></div>
      <div class="title">Falloff（底部面板，权重 0..1）</div>
    </div>
    <p class="hint">
      这是一个静态占位预览，用于快速确认“上下排列、Falloff 按原始权重绘制、无链接线”的视觉意图。<br/>
      真实效果需在 Unity 编辑器中打开 PathProfile 面板查看 CompositeCurveView。
    </p>
  </main>
</body>
</html>
